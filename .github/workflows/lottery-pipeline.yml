name: Eurojackpot Automated Pipeline

on:
  schedule:
    # Εκτέλεση Τετάρτη & Σάββατο στις 04:30 UTC (07:30 ώρα Ελλάδας - την επομένη της κλήρωσης)
    - cron: "30 4 * * 3,6"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: 'main'
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          find . -type f -name "*.pyc" -delete
          find . -type d -name "__pycache__" -delete

      - name: Update Eurojackpot History
        run: |
          python scripts/update_historical_csv_v2.py || true
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

      - name: Run Tests
        run: |
          python -m pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

      - name: Run Full Pipeline
        run: |
          python src/main.py
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          LOTTERY_EMAIL_USER: ${{ secrets.LOTTERY_EMAIL_USER }}
          LOTTERY_EMAIL_PASS: ${{ secrets.LOTTERY_EMAIL_PASS }}
          LOTTERY_EMAIL_TO: ${{ secrets.LOTTERY_EMAIL_TO }}

      - name: Commit Updated Data and Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ reports/ exports/ || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update: draw data, predictions and reports [skip ci]"
            git push
          fi

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: lottery-reports
          path: |
            reports/
            exports/
          if-no-files-found: ignore
