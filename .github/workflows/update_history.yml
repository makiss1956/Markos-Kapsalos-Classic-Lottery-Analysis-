import os
import requests
import pandas as pd
from io import StringIO

# Απευθείας σύνδεσμος λήψης ενημερωμένου dataset Eurojackpot
REMOTE_CSV_URL = "https://www.wynikilotto.net.pl/download/eurojackpot.csv"
LOCAL_CSV_PATH = "data/eurojackpot_raw_history.csv"

def update_dataset():
    print("Λήψη ενημερωμένων δεδομένων Eurojackpot...")
    try:
        # Προσθήκη User-Agent για αποφυγή αποκλεισμών
        headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
        response = requests.get(REMOTE_CSV_URL, headers=headers, timeout=15)
        response.raise_for_status()
        
        # Ανάγνωση των δεδομένων CSV από το κείμενο της απόκρισης
        df_remote = pd.read_csv(StringIO(response.text))
    except Exception as e:
        print(f"Σφάλμα κατά τη λήψη των δεδομένων: {e}")
        return

    # Δημιουργία φακέλου data αν δεν υπάρχει
    os.makedirs(os.path.dirname(LOCAL_CSV_PATH), exist_ok=True)

    # Αποθήκευση με διαχωριστικό ερωτηματικό (';') για συμβατότητα με το project σας
    df_remote.to_csv(LOCAL_CSV_PATH, index=False, sep=';')
    print(f"Το αρχείο {LOCAL_CSV_PATH} ενημερώθηκε επιτυχώς από την πηγή!")

if __name__ == "__main__":
    update_dataset()
