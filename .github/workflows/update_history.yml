name: Auto-Update Eurojackpot History

on:
  schedule:
    - cron: '30 23 * * 2,5'
  workflow_dispatch:

jobs:
  update-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Update Script
        run: python update_eurojackpot.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/eurojackpot_raw_history.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update eurojackpot raw history [skip ci]" && git push)
